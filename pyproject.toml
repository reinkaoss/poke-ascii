[project]
name = "pokebot"
version = "0.1.0"
description = "Offline Pokémon assistant: Pokédex Q&A, ASCII art and battle simulation, with an optional small local LLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.0"]
build = ["pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
pokebot = "pokebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
